# GitHub Pages へ公開する（手順は docs/DEPLOY.md）。
# main への push、または Actions タブから手動実行でビルド → Pages にデプロイ。
# OAuth クライアント ID はリポジトリに入れず、Actions の「変数」VITE_GOOGLE_CLIENT_ID から渡す（未設定でもビルドでき、カレンダー連携が出ないだけ）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          # https://<user>.github.io/<repo>/ で配信するので base をリポジトリ名に
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      # SPA のリロード・直リンク用（404 でも index.html を返す）
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
